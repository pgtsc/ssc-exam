<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSC Exam</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="ssc.css">
</head>
<body>

<nav id="sidebar">
    <button class="toggle-btn" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>

    <div class="px-4 py-3 mb-3 border-bottom border-secondary border-opacity-25 d-flex flex-column">
        <h5 class="text-white fw-bold m-0 mb-4">SSC Exam 2026</h5>
        <h6 class="text-warning fw-bold m-0">CONTROL PANEL</h6>
    </div>
    <div class="nav-content mb-4" style="flex: 1; overflow-y: auto;">
        <label for="excelFile" class="nav-link" style="cursor: pointer;">
            <i id="uploadIcon" class="fa-solid fa-cloud-arrow-up text-danger"></i> Upload Database
        </label>
        <input type="file" id="excelFile" accept=".xlsx, .xls">
        
        <div class="px-4 mt-4 mb-2">
            <span class="text-uppercase small fw-bold" style="font-size: 0.7rem; letter-spacing: 1px; color: white;">Reports</span>
        </div>
            <button class="nav-link btn text-start w-100" onclick="showUI('main-ui')">
                <i class="fa-solid fa-table-list"></i> Dashboard
            </button>

            <button class="nav-link btn text-start w-100" onclick="generateSeatLabels()">
                <i class="fa-solid fa-address-card"></i> Generate Sheet Label
            </button>

            <button class="nav-link btn text-start w-100" onclick="generatePracticalList()">
                <i class="fa-solid fa-flask-vial"></i> Practical Examinees
            </button>

            <button class="nav-link btn text-start w-100" onclick="instituteSummary()">
                <i class="fa-solid fa-chart-pie"></i> Institute Summary
            </button>

            <button class="nav-link btn text-start w-100" onclick="calculateInstituteFee()">
                <i class="fa-solid fa-receipt"></i> Center Fee Statement
            </button>

            <button class="nav-link btn text-start w-100" onclick="">
                <i class="fa-solid fa-layer-group"></i> Seat Plan Shironam
            </button>

            <button class="nav-link btn text-start w-100" onclick="generateSeatPlan()">
                <i class="fa-solid fa-table-cells"></i> View Room Seat Plan
            </button>

            <button class="nav-link btn text-start w-100" onclick="makeRoomSeatPlan()">
                <i class="fa-solid fa-pen-to-square"></i> Make Room Seat Plan
            </button>

            <button class="nav-link btn text-start w-100" onclick="downloadSortedRolls()">
                <i class="fa-solid fa-download"></i> Download Sorted Rolls
            </button>

            <button class="nav-link btn text-start w-100" onclick="resetDatabase()">
                <i class="fa-solid fa-trash text-danger"></i> Reset Database
            </button>
    </div>
</nav>

<div id="content">
    <header class="top-header">
        <div class="brand-info d-flex align-items-center ms-4">
            <img src="logo.png" height="50" width="50" class="logo">
            <div class="brand-text mx-2"><h5>Pirganj Govt. TSC, Pirganj, Thakurgaon</h5></div>
        </div>
        <div>
            <button class="print-btn no-print" onclick="exportToExcel()"><i class="fa-solid fa-file-excel me-2"></i>Export Excel</button>
        </div>
    </header>

    <div id="main-ui">
        <div class="search-box no-print">
            <div class="row align-items-end g-3">
                <div class="col-md-3">
                    <label class="form-label small fw-bold text-muted">Student Type</label>
                    <select id="typeSearch" class="form-select" onchange="applyFilters()">
                        <option value="">All Types</option>
                        <option value="Regular">Regular</option>
                        <option value="Irregular">Irregular</option>
                        <option value="allSubjects">All Subjects</option>                        
                        <option value="notAllSubjects">Not All Subjects</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label small fw-bold text-muted">Subject Filter</label>
                    <select id="subSearch" class="form-select" onchange="applyFilters()">
                        <option value="">All Subjects</option>
                        <option value="Bangla">Bangla</option>
                        <option value="English">English</option>
                        <option value="Math">Math</option>
                        <option value="BDGS">BDGS</option>
                        <option value="Physics">Physics</option>
                        <option value="Chemistry">Chemistry</option>   
                        <option value="Self Emp">Self Emp</option>
                        <option value="Religion">Religion</option>
                        <option value="Trade1">Trade1</option>   
                        <option value="Trade2">Trade2</option>    
                        <option value="Agriculture">Agriculture</option>
                        <option value="Biology">Biology</option>   
                        <option value="HigherMath">Higher Math</option>                   
                    </select>
                </div>
                <div class="col-md-auto">
                    <button class="more-filter-btn" onclick="toggleMoreFilters()">
                        <i class="fa-solid fa-plus me-1" id="filterIcon"></i> More Filters
                    </button>
                </div>
                <div class="col-md-auto ms-auto">
                    <button class="btn btn-primary fw-bold px-4" onclick="applyFilters()"><i class="fa-solid fa-magnifying-glass"></i> Apply Filters</button>
                </div>
            </div>

            <div class="extra-filters" id="extraFilters">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label small fw-bold text-muted">Institute Name</label>
                        <select id="instSearch" class="form-select" onchange="applyFilters()"><option value="">All Institutes</option></select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label small fw-bold text-muted">Trade Name</label>
                        <select id="tradeSearch" class="form-select" onchange="applyFilters()"><option value="">All Trades</option></select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small fw-bold text-muted">Room No.</label>
                        <select id="roomSearch" class="form-select" onchange="applyFilters()"><option value="">All Rooms</option></select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small fw-bold text-muted">Roll No</label>
                        <input type="text" id="rollSearch" class="form-control" placeholder="Search Roll" onkeyup="applyFilters()">
                    </div>
                </div>
            </div>
        </div>

        <div class="px-4 mb-2 d-flex justify-content-between align-items-center">
            <span class="fw-bold text-muted"><i class="fa-solid fa-list-ul me-2"></i>পরীক্ষার্থীর তালিকা</span>
            <span id="stats" class="badge bg-primary rounded-pill px-4 py-2">Total: 0</span>
        </div>

        <div class="data-card shadow-sm">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0" id="dataTable">
                    <thead>
                        <tr>
                            <th class="ps-4">SL</th>
                            <th>Roll</th>
                            <th>Trade Name</th>
                            <th>Status</th>
                            <th>Session</th>
                            <th>Institute</th>
                            <th class="text-center">Room</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr>
                            <td colspan="6" class="text-center py-5 text-muted">
                                <i class="fa-solid fa-file-excel fa-3x mb-3 text-secondary opacity-50"></i>
                                <p class="mb-0 fw-bold">Please upload an Excel database</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    
    <div id="secondary-ui" style="display: none;"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/exceljs/dist/exceljs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script>
    let excelData = [];
    let filteredData = [];
    let currentRoomIndex = 0;
    let roomList = [];
    const subjectList = ["Bangla","English","Math","BDGS","Physics","Chemistry","Self Emp","Religion","Trade1","Trade2"];

    function toggleSidebar() {document.getElementById('sidebar').classList.toggle('collapsed'); document.getElementById('content').classList.toggle('expanded');}

    window.addEventListener("load", () => {
        const saved = localStorage.getItem("sscData");
        if (saved) {
            excelData = JSON.parse(saved);
            autoPopulateDropdowns();
            applyFilters();
            document.getElementById('uploadIcon').classList.replace('text-danger', 'text-success');
        }
    });

    function toggleMoreFilters() {
        const extra = document.getElementById('extraFilters');
        const icon = document.getElementById('filterIcon');
        const isHidden = extra.style.display === 'none' || extra.style.display === '';
        extra.style.display = isHidden ? 'block' : 'none';
        icon.classList.replace(isHidden ? 'fa-plus' : 'fa-minus', isHidden ? 'fa-minus' : 'fa-plus');
    }

    document.getElementById('excelFile').addEventListener('change', async function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const workbook = new ExcelJS.Workbook();
        await workbook.xlsx.load(await file.arrayBuffer());

        const worksheet = workbook.getWorksheet("JCR");
        if (!worksheet) {alert('Sheet "All" not found!'); return;}

        excelData = [];
        let headers = [];
        worksheet.getRow(1).eachCell((cell, colNumber) => { headers[colNumber - 1] = cell.value;});

        worksheet.eachRow((row, rowNumber) => {
            if (rowNumber === 1) return;

            let obj = {};
            row.eachCell((cell, colNumber) => { obj[headers[colNumber - 1]] = cell.value ?? ""; });
            excelData.push(obj);
        });

        localStorage.setItem("sscData", JSON.stringify(excelData));
        const icon = document.getElementById('uploadIcon');
        icon.classList.replace('text-danger', 'text-success');

        autoPopulateDropdowns();
        applyFilters();
    });

    function autoPopulateDropdowns() {
        const trades = [...new Set(excelData.map(item => item.Trade))].filter(Boolean).sort();
        const insts = [...new Set(excelData.map(item => item.Institute))].filter(Boolean).sort();
        const rooms = [...new Set(excelData.map(item => item.Room))].filter(Boolean).sort();
        
        const tradeSelect = document.getElementById('tradeSearch');
        const instSelect = document.getElementById('instSearch');
        const roomSelect = document.getElementById('roomSearch');

        trades.forEach(t => tradeSelect.add(new Option(t, t)));
        insts.forEach(i => instSelect.add(new Option(i, i)));
        rooms.forEach(i => roomSelect.add(new Option(i, i)));
    }

    function hasAllSubjects(row) {return subjectList.every(sub => row[sub] == 1);}

    function applyFilters() {
        if (!excelData.length) return;
        const subQ = document.getElementById('subSearch').value;
        const typeQ = document.getElementById('typeSearch').value;
        const tradeQ = document.getElementById('tradeSearch').value;
        const instQ = document.getElementById('instSearch').value;
        const roomQ = document.getElementById('roomSearch').value;
        const rollQ = document.getElementById('rollSearch').value;


        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = "";
        let count = 0;
        filteredData = [];

        excelData.forEach((row) => {

            const matchRoll = String(row.Roll || "").includes(rollQ);
            const matchTrade = tradeQ === "" || row.Trade === tradeQ;
            const matchInst = instQ === "" || row.Institute === instQ;
            const matchRoom = String(row.Room || "").includes(roomQ);

            let matchType = true;

            if (typeQ === "Regular") {matchType = row.Type === "Regular";}
            else if (typeQ === "Irregular") { matchType = row.Type === "Irregular";}
            else if (typeQ === "allSubjects") {matchType = (row.Type === "Regular") || (row.Type === "Irregular" && hasAllSubjects(row));}
            else if (typeQ === "notAllSubjects") {matchType = (row.Type === "Irregular") && !hasAllSubjects(row);}

            let matchSub = true;
            if (subQ !== "") {
                if(subjectList.includes(subQ)){
                    if (row.Type === 'Irregular') {matchSub = row[subQ] == 1;}  
                }else{
                    matchSub = row["Optional"] == subQ;
                }
            }

            if (matchRoll && matchTrade && matchInst && matchType && matchSub && matchRoom) {
                filteredData.push(row);
                count++;
                tbody.innerHTML += `
                    <tr>
                        <td class="ps-4">${count}</td>
                        <td class="fw-bold">${row.Roll}</td>
                        <td>${row.Trade}</td>
                        <td><span class="badge ${row.Type === 'Regular' ? 'badge-reg' : 'badge-irreg'}">${row.Type}</span></td>
                        <td>${row.Session}</td>
                        <td>${row.Institute}</td>
                        <td class="text-center"><span class="room-badge">${row.Room || ''}</span></td>
                    </tr>`;
            }
        });

        document.getElementById('stats').innerText = `Total: ${count}`;
    }

    function showUI(id) {
        document.getElementById('main-ui').style.display = 'none';
        document.getElementById('secondary-ui').style.display = 'none';
        document.getElementById(id).style.display = 'block';
    }

</script>
<script src="ssc.js"></script>
</body>
</html>
